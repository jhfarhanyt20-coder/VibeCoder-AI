# Keeps the BDCoder AI website awake.
# Render's free plan puts the site to sleep after ~15 minutes without visitors.
# A sleeping site answers search engines with "Disallow: /" in robots.txt, so
# Google treats the whole site as blocked. A light visit every few minutes keeps
# it awake. Free for public repositories.
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-site-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the website
        run: |
          for url in https://bdcoderai.onrender.com/api/health https://bdcoderai.onrender.com/robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 "$url" || true)
            echo "$url -> $code"
          done
