name: Release stable BDCoder AI

# Trigger ONLY on version tags like v0.3.12. Ordinary commits never build or
# publish a stable release (run the workflow on tag v* only).
on:
  push:
    tags:
      - "v*"

# Least privilege: read-only by default; only the release job below (which
# publishes the assets) gets write access to repository contents.
permissions:
  contents: read

# The app source lives in VibeCoderAI-live-fixed/ under this repo; the repo root
# carries the docs, website config and templates. All build commands run inside
# the app directory.
env:
  APP_DIR: VibeCoderAI-live-fixed

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # needed to publish the release assets (NSIS installer + latest.yml)
    steps:
      # persist-credentials: false - the token is not left in .git/config for the
      # build/test steps. Publishing uses GH_TOKEN with the gh CLI, not git.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Verify tag matches package.json
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }

      - name: Run the test suite
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      # Build only. electron-builder's own upload raced (it created the release
      # twice) and silently lost the installer and latest.yml in v0.3.17 and
      # v0.3.18 while the job still passed. The next step uploads everything.
      - name: Build the Windows NSIS installer + update metadata (no upload)
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Package the standalone Node CLI (no runtime dependencies)
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/package-cli.cjs

      - name: Publish the release (installer, blockmap, latest.yml, CLI)
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("release/BDCoderAI-$v.exe", "release/BDCoderAI-$v.exe.blockmap", "release/latest.yml", "release/BDCoder-CLI-$v.tgz")
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Missing build output: $f" } }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME @files --clobber --repo $env:GITHUB_REPOSITORY }
          else { gh release create $env:GITHUB_REF_NAME @files --title $v --notes "" --verify-tag --repo $env:GITHUB_REPOSITORY }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }

      # A release without latest.yml is invisible to the in-app updater: fail loudly.
      - name: Verify the release has every asset
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $names = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          foreach ($n in @("latest.yml", "BDCoderAI-$v.exe", "BDCoderAI-$v.exe.blockmap", "BDCoder-CLI-$v.tgz")) {
            if ($names -notcontains $n) { throw "The release is missing $n" }
          }
          "All four release assets are present."

      # Security: GITHUB_TOKEN is short-lived and scoped to this repository; it
      # is never printed. For signed production releases, set a code-signing
      # certificate secret and wire it here (see PLAN.md / README note) - the
      # project has no certificate configured today, so builds are unsigned.
